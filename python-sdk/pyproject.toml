[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptvault"
version = "1.0.0"
description = "Simple Python client for Prompt Manager API with elegant dot notation access"
readme = "README.md"
authors = [{name = "Prompt Manager", email = "hello@promptmanager.dev"}]
license = {text = "MIT"}
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["prompts", "ai", "llm", "openai", "anthropic"]
dependencies = [
    "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/ZachLaik/promptvault"
Repository = "https://github.com/ZachLaik/promptvault.git"
Issues = "https://github.com/ZachLaik/promptvault/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptvault*"]